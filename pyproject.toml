[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rho-geometry"
version = "0.1.0"
description = "Density-matrix information geometry of neural covariance states."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
analysis = ["scipy>=1.10", "pandas>=2.0", "statsmodels>=0.14"]
neuroimaging = ["nibabel>=5.0", "nilearn>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
